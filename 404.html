<style>
:root{--bg:#F4F5F1;--ink:#101211;--ink-2:#575C56;--lime:#C8F53C;--lime-edge:#A8D21E;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}
main{display:grid;gap:16px;justify-items:center}
.n{font:600 clamp(72px,16vw,160px)/1 "Geologica","Onest",sans-serif;letter-spacing:-.06em;background:linear-gradient(180deg,transparent 58%,var(--lime) 58%,var(--lime) 88%,transparent 88%);padding:0 .06em}
h1{font:600 clamp(24px,3vw,32px)/1.2 "Geologica","Onest",sans-serif;letter-spacing:-.03em}
p{color:var(--ink-2)}
a{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:999px;background:var(--lime);box-shadow:inset 0 -2px 0 var(--lime-edge);color:var(--ink);font-weight:600;text-decoration:none;margin-top:8px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main><span class="n">404</span><h1>Такой страницы нет</h1><p>Возможно, ссылка устарела. Всё нужное есть на главной.</p><a href="/design-studio/">На главную qwe studio</a></main>
